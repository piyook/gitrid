name: Tests

on:
  pull_request:
  push:
    branches: [main]

# The jobs only read the code: no write access for the job token
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the shell scripts
        run: shellcheck gitrid.sh setup_linux.sh setup_gitbash.sh

  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # On Windows this is Git Bash, where the tests also run the gitrid.ps1
      # that setup_gitbash.sh writes for PowerShell
      - name: Run the tests
        shell: bash
        run: npx --yes bats@1.11.0 tests
      # A shell that is not interactive loads no aliases: gitrid must be a
      # command on the PATH
      - name: Install with setup_linux.sh and check gitrid is on the PATH
        if: runner.os != 'Windows'
        run: |
          bash setup_linux.sh
          bash -c 'command -v gitrid'
          [ "$(bash -c 'gitrid --version')" = "$(bash gitrid.sh --version)" ]
